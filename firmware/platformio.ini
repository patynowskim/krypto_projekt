[env:esp32dev]
; ESP-NOW v2 needs ESP-IDF >= 5.4 (espressif32 6.10+ / pioarduino 54.x).
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = time
; CH340 on many DevKit boards
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
board_build.flash_mode = dio
